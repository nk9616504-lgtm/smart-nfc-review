            <!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart NFC & QR Admin Panel</title>
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Smart%20NFC%20Admin%22%2C%22short_name%22%3A%22NFC%20Admin%22%2C%22start_url%22%3A%22%2Fsmart-nfc-review%2Findex.html%22%2C%22scope%22%3A%22%2Fsmart-nfc-review%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f6f9%22%2C%22theme_color%22%3A%22%231a73e8%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F3596%2F3596091.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; font-size: 20px; margin-bottom: 5px; }
        p.sub { text-align: center; color: #666; font-size: 12px; margin-bottom: 15px; }
        
        /* Top Bar with Logout */
        .admin-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .btn-logout { background: #d93025; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* Login Screen */
        #login-screen { text-align: center; padding: 40px 20px; }
        #login-screen input { width: 200px; padding: 10px; font-size: 18px; text-align: center; border: 2px solid #1a73e8; border-radius: 6px; margin-bottom: 15px; letter-spacing: 3px; }
        #login-screen button { background: #1a73e8; color: white; padding: 10px 25px; font-size: 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        
        /* Redirect Screen */
        #redirect-screen { display: none; text-align: center; padding: 60px 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Admin Cards */
        #admin-panel { display: none; }
        .card-box { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
        .badge-active { background: #e6f4ea; color: #137333; padding: 3px 8px; border-radius: 4px; font-size: 11px; }
        .badge-empty { background: #f1f3f4; color: #5f6368; padding: 3px 8px; border-radius: 4px; font-size: 11px; }
        input[type="text"] { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        button { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-save { background: #137333; color: white; }
        .btn-qr { background: #1a73e8; color: white; }
        .btn-nfc { background: #5f6368; color: white; }
        .btn-share { background: #008069; color: white; }
        .btn-clear { background: #d93025; color: white; }
        .qrcode-container { display: none; text-align: center; margin-top: 10px; padding: 10px; background: white; border: 1px dashed #ccc; }
        .qrcode-container img, .qrcode-container canvas { margin: 0 auto; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Customer Redirect Screen -->
    <div id="redirect-screen">
        <div class="loader"></div>
        <h3 id="redirect-msg">Google Review பக்கத்திற்கு அழைத்துச் செல்லப்படுகிறது...</h3>
    </div>

    <!-- 2. Admin Login Screen -->
    <div id="login-screen" style="display: none;">
        <h2>🔒 Admin Login</h2>
        <p class="sub">தொடர அட்மின் பாஸ்வேர்டை உள்ளிடவும்</p>
        <input type="password" id="admin-pass" placeholder="****" maxlength="10"><br>
        <button onclick="checkPassword()">Login</button>
    </div>

    <!-- 3. Admin Panel Dashboard -->
    <div id="admin-panel">
        <div class="admin-top-bar">
            <div>
                <h2 style="text-align: left; margin:0;">Smart NFC Admin</h2>
                <p class="sub" style="text-align: left; margin:0;">Cloud Management</p>
            </div>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
        </div>
        <div id="cards-container"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🌐 Firebase Configuration (உங்கள் ஒரிஜினல் புராஜெக்ட் விவரங்கள்)
    const firebaseConfig = {
        apiKey: "AIzaSyA...", 
        authDomain: "smart-nfc-review.firebaseapp.com",
        projectId: "smart-nfc-review",
        storageBucket: "smart-nfc-review.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASSWORD = "4097";
    const totalCards = 10;
    const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/') + '#card';

    async function initApp() {
        const hash = window.location.hash;

        if (hash && hash.startsWith('#card')) {
            document.getElementById('redirect-screen').style.display = 'block';
            const cardId = hash.replace('#', '');

            try {
                const docSnap = await getDoc(doc(db, "nfc_cards", cardId));
                if (docSnap.exists() && docSnap.data().link) {
                    let targetUrl = docSnap.data().link.trim();
                    if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                        targetUrl = 'https://' + targetUrl;
                    }
                    window.location.replace(targetUrl);
                } else {
                    document.querySelector('.loader').style.display = 'none';
                    document.getElementById('redirect-msg').innerText = "இந்த கார்டு இன்னும் ஆக்டிவேட் செய்யப்படவில்லை (Card Not Activated).";
                }
            } catch (error) {
                document.querySelector('.loader').style.display = 'none';
                document.getElementById('redirect-msg').innerText = "இணைப்பில் பிழை ஏற்பட்டுள்ளது. மீண்டும் முயற்சிக்கவும்.";
            }
        } else {
            if (sessionStorage.getItem('nfc_admin_logged') === 'true') {
                showAdminPanel();
            } else {
                document.getElementById('login-screen').style.display = 'block';
            }
        }
    }

    window.checkPassword = function() {
        const inputPass = document.getElementById('admin-pass').value;
        if (inputPass === ADMIN_PASSWORD) {
            sessionStorage.setItem('nfc_admin_logged', 'true');
            document.getElementById('login-screen').style.display = 'none';
            showAdminPanel();
        } else {
            alert('தவறான பாஸ்வேர்டு! மீண்டும் முயற்சிக்கவும்.');
            document.getElementById('admin-pass').value = '';
        }
    }

    window.logoutAdmin = function() {
        sessionStorage.removeItem('nfc_admin_logged');
        location.reload();
    }

    async function showAdminPanel() {
        document.getElementById('admin-panel').style.display = 'block';
        await renderCards();
    }

    window.renderCards = async function() {
        let container = document.getElementById('cards-container');
        container.innerHTML = '<p style="text-align:center;">டேட்டா லோட் ஆகிறது...</p>';

        let firestoreData = {};
        try {
            let querySnapshot = await getDocs(collection(db, "nfc_cards"));
            querySnapshot.forEach((doc) => {
                firestoreData[doc.id] = doc.data();
            });
        } catch (e) {
            container.innerHTML = '<p style="color:red; text-align:center;">Firebase இணைப்பதில் சிக்கல். உங்கள் கன்சோல் இணைப்பைச் சரிபார்க்கவும்.</p>';
            return;
        }

        let html = '';
        for (let i = 1; i <= totalCards; i++) {
            let cardId = 'card' + String(i).padStart(3, '0');
            let cardData = firestoreData[cardId] || { name: '', link: '' };
            let isActive = (cardData.name && cardData.name !== '') || (cardData.link && cardData.link !== '');

            html += `
                <div class="card-box" id="box_${cardId}">
                    <div class="card-header">
                        <span>CARD #${String(i).padStart(3, '0')}</span>
                        <span class="${isActive ? 'badge-active' : 'badge-empty'}">${isActive ? 'Active' : 'Empty'}</span>
                    </div>
                    <input type="text" id="name_${cardId}" placeholder="கடையின் பெயர் (Shop Name)" value="${cardData.name || ''}">
                    <input type="text" id="link_${cardId}" placeholder="Google Review Link இங்கே பேஸ்ட் செய்யவும்" value="${cardData.link || ''}">
                    <div class="btn-group">
                        <button class="btn-save" onclick="saveCard('${cardId}')">💾 Save</button>
                        <button class="btn-qr" onclick="toggleQR('${cardId}')">📷 QR</button>
                        <button class="btn-nfc" onclick="copyNfc('${cardId}')">📋 Copy</button>
                        <button class="btn-share" onclick="shareNfc('${cardId}')">📤 NFC Share</button>
                        <button class="btn-clear" onclick="clearCard('${cardId}')">🗑️ Clear</button>
                    </div>
                    <div id="qrcode_${cardId}" class="qrcode-container"></div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    window.saveCard = async function(cardId) {
        let name = document.getElementById('name_' + cardId).value;
        let link = document.getElementById('link_' + cardId).value;
        
        try {
            await setDoc(doc(db, "nfc_cards", cardId), { name: name, link: link });
            alert('Card ' + cardId + ' பாதுகாப்பாகச் சேமிக்கப்பட்டது!');
            renderCards();
        } catch (e) {
            alert('சேமிப்பதில் பிழை: ' + e.message);
        }
    }

    window.clearCard = async function(cardId) {
        if(confirm('இந்த கார்டு விவரங்களை அழிக்க விரும்புகிறீர்களா?')) {
            try {
                await setDoc(doc(db, "nfc_cards", cardId), { name: '', link: '' });
                renderCards();
            } catch (e) {
                alert('அழிப்பதில் பிழை: ' + e.message);
            }
        }
    }

    window.copyNfc = function(cardId) {
        let nfcUrl = baseUrl + cardId.replace('card', '');
        navigator.clipboard.writeText(nfcUrl).then(() => {
            alert('NFC லிங்க் காப்பி செய்யப்பட்டது:\n' + nfcUrl);
        });
    }

    window.shareNfc = function(cardId) {
        let nfcUrl = baseUrl + cardId.replace('card', '');
        if (navigator.share) {
            navigator.share({
                url: nfcUrl,
            }).catch(() => {});
        } else {
            copyNfc(cardId);
        }
    }

    window.toggleQR = function(cardId) {
        let qrDiv = document.getElementById('qrcode_' + cardId);
        let nfcUrl = baseUrl + cardId.replace('card', '');
        
        if (qrDiv.style.display === 'block') {
            qrDiv.style.display = 'none';
        } else {
            qrDiv.innerHTML = '';
            new QRCode(qrDiv, {
                text: nfcUrl,
                width: 150,
                height: 150
            });
            qrDiv.style.display = 'block';
        }
    }

    document.getElementById('admin-pass').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkPassword();
        }
    });

    initApp();
</script>

</body>
</html> = '
