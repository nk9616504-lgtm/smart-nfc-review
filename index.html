<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart NFC & QR Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; font-size: 20px; margin-bottom: 5px; }
        p.sub { text-align: center; color: #666; font-size: 12px; margin-bottom: 15px; }
        .card-box { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
        .badge-active { background: #e6f4ea; color: #137333; padding: 3px 8px; border-radius: 4px; font-size: 11px; }
        .badge-empty { background: #f1f3f4; color: #5f6368; padding: 3px 8px; border-radius: 4px; font-size: 11px; }
        input[type="text"] { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        button { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-save { background: #137333; color: white; }
        .btn-qr { background: #1a73e8; color: white; }
        .btn-nfc { background: #5f6368; color: white; }
        .btn-share { background: #008069; color: white; }
        .btn-clear { background: #d93025; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Smart NFC & QR Admin Panel</h2>
    <p class="sub">Spot Link Editor & Management</p>

    <div id="cards-container"></div>
</div>

<script>
    const totalCards = 10;
    const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/') + '#card';

    function renderCards() {
        let container = document.getElementById('cards-container');
        let html = '';

        for (let i = 1; i <= totalCards; i++) {
            let cardId = 'card' + String(i).padStart(3, '0');
            let savedName = localStorage.getItem(cardId + '_name') || '';
            let savedLink = localStorage.getItem(cardId + '_link') || '';
            let isActive = savedName !== '' || savedLink !== '';

            html += `
                <div class="card-box" id="box_${cardId}">
                    <div class="card-header">
                        <span>CARD #${String(i).padStart(3, '0')}</span>
                        <span class="${isActive ? 'badge-active' : 'badge-empty'}">${isActive ? 'Active' : 'Empty'}</span>
                    </div>
                    <input type="text" id="name_${cardId}" placeholder="கடையின் பெயர் (Shop Name)" value="${savedName}">
                    <input type="text" id="link_${cardId}" placeholder="Google Review Link இங்கே பேஸ்ட் செய்யவும்" value="${savedLink}">
                    <div class="btn-group">
                        <button class="btn-save" onclick="saveCard('${cardId}')">💾 Save</button>
                        <button class="btn-qr" onclick="showQR('${cardId}')">📷 QR</button>
                        <button class="btn-nfc" onclick="copyNfc('${cardId}')">📋 Copy</button>
                        <button class="btn-share" onclick="shareNfc('${cardId}')">📤 NFC Share</button>
                        <button class="btn-clear" onclick="clearCard('${cardId}')">🗑️ Clear</button>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function saveCard(cardId) {
        let name = document.getElementById('name_' + cardId).value;
        let link = document.getElementById('link_' + cardId).value;
        localStorage.setItem(cardId + '_name', name);
        localStorage.setItem(cardId + '_link', link);
        alert('Card ' + cardId + ' சேமிக்கப்பட்டது!');
        renderCards();
    }

    function clearCard(cardId) {
        if(confirm('இந்த கார்டு விவரங்களை அழிக்க விரும்புகிறீர்களா?')) {
            localStorage.removeItem(cardId + '_name');
            localStorage.removeItem(cardId + '_link');
            renderCards();
        }
    }

    function copyNfc(cardId) {
        let nfcUrl = baseUrl + cardId.replace('card', '');
        navigator.clipboard.writeText(nfcUrl).then(() => {
            alert('NFC லிங்க் காப்பி செய்யப்பட்டது:\n' + nfcUrl);
        });
    }

    function shareNfc(cardId) {
        let nfcUrl = baseUrl + cardId.replace('card', '');
        if (navigator.share) {
            navigator.share({
                title: 'Smart NFC Card - ' + cardId,
                text: 'Supplier-க்கான NFC URL:',
                url: nfcUrl,
            }).catch(() => {});
        } else {
            copyNfc(cardId);
        }
    }

    function showQR(cardId) {
        let nfcUrl = baseUrl + cardId.replace('card', '');
        alert('QR Link for ' + cardId + ':\n' + nfcUrl);
    }

    renderCards();
</script>

</body>
</html>
